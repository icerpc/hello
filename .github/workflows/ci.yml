name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 0 * * 0" # weekly, so base-image fixes reach the deployed image

# One active run per ref. On PRs, newer pushes cancel older in-progress runs;
# on main, runs queue instead so an in-flight publish/deploy always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          # Attestations show up as extra unknown/unknown entries in the manifest.
          provenance: false
          push: ${{ github.event_name != 'pull_request' && github.repository == 'icerpc/hello' }}
          tags: |
            icerpc/helloatest
            ghcr.io/icerpc/hello:${{ github.sha }}
            ghcr.io/icerpc/helloatest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: image
    if: github.event_name != 'pull_request' && github.repository == 'icerpc/hello'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.HELLO_HOST }}
          username: ${{ secrets.HELLO_USERNAME }}
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          script: |
            cd /opt/hello
            docker compose pull hello-icerpc
            docker compose up -d hello-icerpc
            docker system prune -f

  cleanup:
    name: Cleanup old images
    needs: image
    if: github.event_name != 'pull_request' && github.repository == 'icerpc/hello'
    runs-on: ubuntu-latest

    steps:
      - name: Delete old container images (keep the 10 most recent)
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: hello
          package-type: container
          min-versions-to-keep: 10
